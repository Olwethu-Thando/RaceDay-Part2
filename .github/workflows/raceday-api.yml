name: RaceDay API CI
on:
  push:
    paths:
      - 'RaceDay.Api/**'
      - 'RaceDay.Tests/**'
      - 'RaceDay.sln'
      - '.github/workflows/raceday-api.yml'
  pull_request:
    paths:
      - 'RaceDay.Api/**'
      - 'RaceDay.Tests/**'
      - 'RaceDay.sln'
      - '.github/workflows/raceday-api.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
